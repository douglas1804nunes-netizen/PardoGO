name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check backend/server.js

      - name: Run test suite
        run: npm test

      - name: Run doctor
        run: npm run doctor

      - name: Check Capacitor
        run: npx cap --version

      - name: Sync Android
        run: npx cap sync android

      - name: Capacitor doctor
        run: npx cap doctor

      - name: Mobile checks
        run: npm run mobile:check
