name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Run test suite
        run: npm test

      - name: Run doctor
        run: npm run doctor

      - name: Check Capacitor
        run: npx cap --version

      - name: Sync Android
        run: npx cap sync android

      - name: Capacitor doctor
        if: matrix.os == 'ubuntu-latest'
        run: npx cap doctor

      - name: Mobile checks
        run: npm run mobile:check
