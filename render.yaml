services:
  - type: web
    name: pardogo
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://pardogo-8yn0.onrender.com
      - key: CANONICAL_BASE_URL
        value: https://pardogo-8yn0.onrender.com
      - key: DB_PATH
        value: /var/data/pardogo.sqlite
      - key: ADMIN_INITIAL_PHONE
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: FORCE_HTTPS
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: REQUIRE_SECURE_ENV
        value: "1"
      - key: CORS_ORIGIN
        value: https://pardogo-8yn0.onrender.com,https://localhost
      - key: SESSION_DAYS
        value: "7"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: CITY_GEOFENCE_RADIUS_KM
        value: "55"
      - key: CITY_AVERAGE_SPEED_KMH
        value: "28"
      - key: MAP_TIMEOUT_MS
        value: "5500"
      - key: SSE_PING_MS
        value: "25000"
      - key: SSE_TICKET_TTL_MS
        value: "60000"
      - key: DRIVER_LOCATION_STALE_SECONDS
        value: "120"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PIX_KEY
        sync: false
      - key: PIX_WEBHOOK_ENABLED
        value: "0"
      - key: PIX_WEBHOOK_SECRET
        sync: false
      - key: PIX_MERCHANT_NAME
        value: PARDOGO
      - key: PIX_MERCHANT_CITY
        value: SANTA RITA DO PARDO
      - key: PIX_DESCRIPTION
        value: RECARGA PARDOGO
    disk:
      name: pardogo-data
      mountPath: /var/data
      sizeGB: 1
